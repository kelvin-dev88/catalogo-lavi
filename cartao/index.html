<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canais Oficiais | Lavi Perfumes</title>
    <meta name="description" content="Conheça os canais oficiais da Lavi Perfumes. Acesse nosso WhatsApp, Instagram e catálogo de perfumes.">

    <!-- Biblioteca de ícones dos botões (requer conexão com a internet) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* CORES ORIGINAIS DA LAVI */
        :root {
            --fundo: #f4f0e9;
            --cartao: #fffcf7;
            --dourado: #8a6d3b;
            --marrom: #56432b;
            --borda: #d8c9af;
            --botao: #f6f0e6;
        }

        /* CONFIGURAÇÕES GERAIS */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(
                circle at top,
                #fffdf9,
                #f4f0e9 65%,
                #eae1d5
            );
            font-family: Georgia, serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CARTÃO PRINCIPAL */
        .cartao {
            position: relative;
            width: 100%;
            max-width: 430px;
            padding: 45px 25px;
            background: var(--cartao);
            border: 1px solid var(--borda);
            border-radius: 20px;
            text-align: center;
            box-shadow:
                0 20px 50px rgba(86, 67, 43, 0.16),
                0 5px 15px rgba(86, 67, 43, 0.06);
            overflow: hidden;
        }

        /* PEQUENO DETALHE DOURADO NO TOPO */
        .cartao::before {
            content: "";
            position: absolute;
            top: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(
                90deg,
                transparent,
                #b99a61,
                transparent
            );
        }

        /* LOGO DA LAVI */
        .logo {
            display: block;
            width: 150px;
            height: 150px;
            margin: 0 auto 25px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d8c5a4;
            padding: 3px;
            box-shadow: 0 8px 25px rgba(86, 67, 43, 0.18);
        }

        /* TÍTULO E LINHA DOURADA */
        .titulo {
            margin: 0 0 12px;
            color: var(--marrom);
            font-size: 26px;
            font-weight: 400;
        }

        .titulo::after {
            content: "";
            display: block;
            width: 65px;
            height: 2px;
            margin: 12px auto 0;
            background: var(--dourado);
            border-radius: 5px;
        }

        /* FRASE PRINCIPAL */
        .frase {
            margin: 0 0 22px;
            color: var(--dourado);
            font-size: 17px;
            font-style: italic;
            line-height: 1.6;
        }

        /* ÁREA DOS BOTÕES */
        .botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* BOTÕES COM ÍCONES E SOMBRA */
        .botao {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;
            background: var(--botao);
            color: var(--marrom);
            border: 1px solid var(--borda);
            border-radius: 30px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 5px 14px rgba(86, 67, 43, 0.12);
            transition:
                background 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .botao i {
            font-size: 18px;
            color: var(--dourado);
        }

        /* EFEITO AO PASSAR O MOUSE */
        .botao:hover {
            background: #eee3d0;
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(86, 67, 43, 0.22);
        }

        .botao:active {
            transform: translateY(-1px);
        }

        .botao:focus-visible {
            outline: 2px solid var(--dourado);
            outline-offset: 4px;
        }

        /* RODAPÉ */
        .rodape {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid var(--borda);
            color: var(--dourado);
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* AJUSTES PARA CELULAR */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .cartao {
                padding: 35px 20px;
                border-radius: 16px;
            }

            .titulo {
                font-size: 24px;
            }

            .botao {
                padding: 16px;
            }
        }

        /* RESPEITA PREFERÊNCIA DE MENOS ANIMAÇÕES */
        @media (prefers-reduced-motion: reduce) {
            .botao {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="cartao">
        <!-- LOGO: mantenha logocartao.jpeg na mesma pasta deste index.html -->
        <img
            src="logocartao.jpeg"
            alt="Logo da Lavi Perfumes"
            class="logo"
        >

        <h1 class="titulo">Canais Oficiais</h1>
        <p class="frase">Sua essência está aqui.</p>

        <!-- BOTÕES DE NAVEGAÇÃO -->
        <nav class="botoes" aria-label="Canais oficiais da Lavi">
            <a
                href="https://wa.me/5538998648867"
                class="botao"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="bi bi-whatsapp" aria-hidden="true"></i>
                WhatsApp
            </a>

            <a
                href="https://www.instagram.com/lavi_fragrancias/"
                class="botao"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="bi bi-instagram" aria-hidden="true"></i>
                Instagram
            </a>

            <a
                href="https://laviperfumes.com.br/"
                class="botao"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="bi bi-bag" aria-hidden="true"></i>
                Conheça nosso catálogo
            </a>
        </nav>

        <footer class="rodape">laviperfumes.com.br</footer>
    </main>
</body>
</html>
